server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;  # keep https behind the Fly proxy

    # /about -> about.html, /blog -> blog/index.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    location ~* \.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?|pdf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/xml application/rss+xml image/svg+xml;
}
